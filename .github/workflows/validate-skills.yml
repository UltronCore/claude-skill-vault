name: Validate Skills

on:
  push:
    branches: [main]
    paths: ['skills/**']
  pull_request:
    branches: [main]
    paths: ['skills/**']

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate SKILL.md structure
    steps:
      - uses: actions/checkout@v4

      - name: Count skills
        run: |
          ACTIVE=$(find skills -name "SKILL.md" -not -path "*/_archive/*" -not -path "*/_obsolete/*" | wc -l)
          echo "Active skills: $ACTIVE"
          echo "SKILL_COUNT=$ACTIVE" >> $GITHUB_ENV

      - name: Check all SKILL.md have frontmatter
        run: |
          FAIL=0
          for f in $(find skills -name "SKILL.md" -not -path "*/_archive/*" -not -path "*/_obsolete/*"); do
            if ! head -1 "$f" | grep -q "^---"; then
              echo "MISSING FRONTMATTER: $f"
              FAIL=$((FAIL+1))
            fi
            if ! grep -q "^name:" "$f"; then
              echo "MISSING NAME: $f"
              FAIL=$((FAIL+1))
            fi
            if ! grep -q "^description:" "$f"; then
              echo "MISSING DESC: $f"
              FAIL=$((FAIL+1))
            fi
          done
          echo "Failures: $FAIL"
          [ $FAIL -eq 0 ] || exit 1

      - name: Verify no credentials in skills
        run: |
          # Check for potential secrets
          if grep -r "AKIA\|ghp_\|sk-\|password:\s*[^\$]" skills/ --include="*.md" | grep -v "example\|placeholder\|YOUR_"; then
            echo "Potential credentials found!"
            exit 1
          fi
          echo "No credentials detected"
